<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f2" />
    <meta name="description" content="اكتشف مشاريع بدر السلمي: ARX، حِصّة، دارس، Trex، Mapx، LuminaUI وAPI-BADR." />
    <link rel="icon" href="/badr-mark.svg" type="image/svg+xml" />
    <script>
      try {
        const language = localStorage.getItem("portfolio-language");
        if (language === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
        const savedTheme = localStorage.getItem("portfolio-theme");
        document.documentElement.dataset.theme = savedTheme === "dark" || (savedTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      } catch { document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>برمجياتي — مساحة للأفكار التي أصبحت واقعًا</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
